; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcu-32s    # 默认使用 nodemcu-32s 环境

[env:nodemcu-32s]
platform = espressif32        # 使用 ESP32 平台
board = nodemcu-32s          # 开发板型号
framework = arduino          # 使用 Arduino 框架
upload_speed = 1000000      # 上传速率 1Mbps
monitor_speed = 115200      # 串口监视器速率 115200bps

# 项目依赖库
lib_deps = 
    ivanseidel/ArduinoThread@^2.1.1    # 多线程支持库
    bodmer/TFT_eSPI@^2.5.43            # TFT 显示驱动库
    lennarthennigs/Button2@^2.2.4       # 按钮处理库
    lvgl/lvgl@^9.0.0                   # LVGL 图形库
    knolleary/PubSubClient @ ^2.8.0    # MQTT 客户端库
    

# 编译标志
build_flags = 
    # TFT_eSPI 配置
    -D USER_SETUP_LOADED               # 启用用户自定义配置
    -D ST7789_DRIVER                   # 使用 ST7789 显示屏驱动
    -D TFT_WIDTH=240                   # 屏幕宽度 240 像素
    -D TFT_HEIGHT=240                  # 屏幕高度 240 像素
    -D TFT_MOSI=17                     # SPI MOSI 引脚定义
    -D TFT_SCLK=18                     # SPI SCLK 引脚定义
    -D TFT_DC=5                        # 数据/命令控制引脚
    -D TFT_RST=19                      # 复位引脚
    -D TFT_BL=22                       # 背光控制引脚
    -D TOUCH_CS=-1                     # 禁用触摸功能
    -D SPI_FREQUENCY=27000000          # SPI 时钟频率 27MHz
    
    # WiFi 配置
    -D WIFI_SSID=\"Mi\"                # WiFi SSID
    -D WIFI_PASSWORD=\"12345678\"      # WiFi 密码
    
    # LVGL 配置
    -I src/config                      # 包含配置文件目录
    -D LV_DISPLAY_ROTATION=LV_DISPLAY_ROTATION_180    # 显示旋转180度

# 源文件过滤器
build_src_filter = 
    +<*>                               # 包含所有源文件
    +<../.pio/libdeps/nodemcu-32s/lvgl/demos>    # 包含 LVGL demos

[env:native]
platform = native@^1.1.3
framework = 
lib_deps = 
	googletest
