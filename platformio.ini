; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32@^6.6.0
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200

; 使用内置 USB CDC 烧录和监控（无需串口芯片）
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_rts = 0
monitor_dtr = 0

; direct filter 让 ANSI 转义码原样送给终端，避免 default/printable filter 把 ESC 转成 ␛ 乱码
monitor_filters = direct
monitor_eol = LF
monitor_raw = yes

; ---- ESP32-S3 N16R8: 16MB Flash + 8MB PSRAM (Octal) ----
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

lib_deps =
	lovyan03/LovyanGFX@^1.1.16
	lvgl/lvgl@^9.0.0
	bblanchon/ArduinoJson@^7.0.0

build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=3
	-fpermissive
	; LVGL lv_conf.h 路径
	-I src/config
	-DLV_CONF_INCLUDE_SIMPLE
	; 大屏逻辑分辨率
	-DTFT_BIG_WIDTH=480
	-DTFT_BIG_HEIGHT=480
	-DTFT_SUB_WIDTH=240
	-DTFT_SUB_HEIGHT=240
	; LVGL 渲染旋转保持 0
	-DLV_DISPLAY_ROTATION=LV_DISPLAY_ROTATION_0
	; WiFi
	-DWIFI_SSID=\"Xiaomi_2905\"
	-DWIFI_PASSWORD=\"12345678\"
	; =============================================================
	; 🎯 固件版本 + OTA 远程升级配置
	; =============================================================
	; 固件版本号（每次发版时修改，设备用来和远程 manifest 对比）
	-DFIRMWARE_VERSION=\"1.0.2\"
	; OTA manifest 远程地址（nginx 上的 JSON 版本清单）
	;   manifest.json 格式：
	;   { "version": "1.1.0", "url": "firmware_1.1.0.bin", "md5": "abc123..." }
	-DOTA_MANIFEST_URL=\"http://118.145.100.70/manifest.json\"
	; OTA 检查间隔 (ms)
	;   300000  = 5分钟  600000 = 10分钟  1800000 = 30分钟  3600000 = 1小时
	-DOTA_CHECK_INTERVAL_MS=300000
	; =============================================================
	; =============================================================
	; 🎯 屏幕刷新率调优参数（统一在此处配置，无需改源码）
	; =============================================================
	; 以下 4 个参数共同决定屏幕刷新率和稳定性：
	;
	; 刷新率瓶颈分析：
	;   每帧耗时 ≈ LOOP_DELAY_MS + flush耗时
	;   flush耗时 ≈ (SCREEN_W × SCREEN_H × 2bytes) / SPI_FREQ + PANEL_COUNT × PANEL_SWITCH_DELAY_US
	;   FPS ≈ 1000 / 每帧耗时(ms)
	;
	; 调整策略：
	;   追求流畅 → 减小 LOOP_DELAY_MS，提高 SPI_FREQ_HZ，增大 LVGL_BUF_LINES
	;   追求稳定 → 增大 PANEL_SWITCH_DELAY_US，降低 SPI_FREQ_HZ
	;   遇雪花屏 → 优先降 SPI_FREQ_HZ，其次加 PANEL_SWITCH_DELAY_US
	;
	; 参考配置：
	;   极限模式: SPI=80MHz, LOOP=0ms, SWITCH=0us, BUF=240  → ~60+ FPS ⚠️ 需实测
	;   流畅模式: SPI=40MHz, LOOP=16ms, SWITCH=5us, BUF=120  → ~45-60 FPS
	;   均衡模式: SPI=20MHz, LOOP=33ms, SWITCH=20us, BUF=60  → ~25-30 FPS ✅ 推荐
	;   稳定模式: SPI=10MHz, LOOP=50ms, SWITCH=50us, BUF=60  → ~15-20 FPS
	; =============================================================
	; SPI 总线频率 (Hz)
	;   硬件极限：ESP32-S3 APB=80MHz，SPI 时钟最大 = APB/1 = 80MHz
	;   有效分频：80M / 40M / 26.6M / 20M / 16M / 10M / 8M / 5M / 4M
	;   实际瓶颈：多屏跳线走线的信号完整性，而非芯片本身
	;   80000000 = 80MHz 🔥 硬件极限，需优质走线+屏蔽
	;   60000000 = 60MHz ⚠️ 非标分频，可能回退到 40MHz
	;   40000000 = 40MHz ⚠️ 跳线极限，需短走线
	;   20000000 = 20MHz 中等
	;   10000000 = 10MHz 稳定
	;    5000000 =  5MHz 最保守
	-DLCD_SPI_FREQ_HZ=60000000UL
	; 屏间切换延时 (μs)
	;   SPI 从当前屏切到下一屏时 CS 切换的缓冲时间
	;   硬件极限：0μs（完全无延时，CS 切换本身有几个时钟周期开销）
	;   0=极限（无延时，依赖 SPI 时钟间隙）
	;   2=激进
	;   5=较快 ⚠️ 当前
	;   20=推荐
	;   50=保守
	;   100=最保守
	-DPANEL_SWITCH_DELAY_US=2
	; 主循环刷新间隔 (ms)
	;   控制帧率上限
	;   硬件极限：0ms（不做人为限帧，完全由 LVGL 调度决定）
	;   0=极限（无延迟，~60+ FPS，取决于 flush 速度）
	;   5=激进（~50+ FPS）
	;   10=快（~50 FPS）
	;   16=流畅（~60 FPS）⚠️ 当前
	;   33=均衡（~30 FPS）
	;   50=保守（~20 FPS）
	;   100=最保守（~10 FPS）
	-DLOOP_DELAY_MS=5
	; LVGL 渲染缓冲区行数
	;   越大 → 每次 flush 覆盖更多像素 → 减少 flush 回调次数
	;   硬件极限：240 行 = 整屏高度（Full Buffer 模式）
	;   PSRAM 占用：buf = SCREEN_W × BUF_LINES × 2 bytes × 2块(双缓冲)
	;   240=全屏 (720×240×2×2=691KB) 🔥 硬件极限，8MB PSRAM 绰绰有余
	;   120=半屏 (720×120×2×2=346KB) ⚠️ 当前
	;   60=默认 (720×60×2×2=173KB)
	-DLVGL_BUF_LINES=240
	; =============================================================

build_src_filter =
	+<*>

[env:native]
platform = native@^1.1.3
framework =
lib_deps =
	googletest
