; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32@^6.6.0
board = esp32-s3-devkitc-1
framework = arduino
upload_protocol = esptool
upload_speed = 921600
monitor_speed = 115200

; 使用内置 USB CDC 烧录和监控（无需串口芯片）
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
monitor_rts = 0
monitor_dtr = 0

; direct filter 让 ANSI 转义码原样送给终端，避免 default/printable filter 把 ESC 转成 ␛ 乱码
monitor_filters = direct
monitor_eol = LF
monitor_raw = yes

; ---- ESP32-S3 N16R8: 16MB Flash + 8MB PSRAM (Octal) ----
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

lib_deps =
	lovyan03/LovyanGFX@^1.1.16
	lvgl/lvgl@^9.0.0

build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=3
	-fpermissive
	; LVGL lv_conf.h 路径
	-I src/config
	-DLV_CONF_INCLUDE_SIMPLE
	; 大屏逻辑分辨率
	-DTFT_BIG_WIDTH=480
	-DTFT_BIG_HEIGHT=480
	-DTFT_SUB_WIDTH=240
	-DTFT_SUB_HEIGHT=240
	; LVGL 渲染旋转保持 0
	-DLV_DISPLAY_ROTATION=LV_DISPLAY_ROTATION_0
	; WiFi
	-DWIFI_SSID=\"Xiaomi_2905\"
	-DWIFI_PASSWORD=\"12345678\"

build_src_filter =
	+<*>

[env:native]
platform = native@^1.1.3
framework =
lib_deps =
	googletest
